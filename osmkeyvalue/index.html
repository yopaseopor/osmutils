<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ca">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.fbcdn.net https://*.facebook.com https://unpkg.com https://cdnjs.cloudflare.com https://api.mapillary.com https://graph.mapillary.com https://overpass-api.de https://overpass.kumi.systems https://nominatim.openstreetmap.org https://*.openstreetmap.org https://*.mapillary.com https://cors-anywhere.herokuapp.com https://api.allorigins.win https://api.maptiler.com; style-src 'self' 'unsafe-inline' https://*.fbcdn.net https://*.facebook.com; img-src 'self' data: https:; connect-src 'self' https://*.fbcdn.net https://*.facebook.com https://api.mapillary.com https://graph.mapillary.com https://overpass-api.de https://overpass.kumi.systems https://nominatim.openstreetmap.org https://*.openstreetmap.org https://*.mapillary.com https://cors-anywhere.herokuapp.com https://api.allorigins.win https://api.maptiler.com; font-src 'self' https://*.fbcdn.net https://*.facebook.com https://fonts.gstatic.com https://fonts.googleapis.com;">
	<!--@@ Título a modificar -->
	<title>OSM Utils</title>
	<!--@@ Título a modificar para la descripción -->
	<meta content="OSM Utils" name="description"/>

	<link rel="stylesheet" href="src/api/jquery-ui-1.12.1.custom/jquery-ui.min.css" type="text/css"/>
	<link rel="stylesheet" href="src/api/openlayers/v6.2.2-custom/ol.css" type="text/css"/>
	<link rel="stylesheet" href="src/css/font-awesome.css" type="text/css"/>
	<link rel="stylesheet" href="src/css/index.css" type="text/css"/>
	<link rel="stylesheet" href="src/css/language-selector.css" type="text/css"/>
	
	<link rel="icon" href="favicon.ico"/>
</head>
<body>
	<div class="flex-row">
	<!--@@ Modificar comentario de Javascript -->
		<div id="map" class="map">Loading... You need Javascript...Cargando necesitas Javascript...Carregant...necessites Javascript</div>
		<div id="menu" class="menu">
			<!-- Language Selector -->
			<div id="language-selector-container" class="language-selector-wrapper"></div>
			<!-- Key Searcher (replaces layer searcher) -->
			<div id="key-search-container" style="margin: 10px 0;">
			  <input type="text" id="layer-search" data-i18n="keysLabel" placeholder="Search OSM keys..." style="width: 100%; padding: 5px;">
			  <div id="layer-search-dropdown"></div>
			</div>
			<!-- Value Searcher (replaces overlay searcher) -->
			<div id="value-search-container" style="margin: 10px 0;">
			  <input type="text" id="overlay-search" data-i18n="valuesLabel" placeholder="Select a key first, then search values..." style="width: 100%; padding: 5px;">
			  <div id="overlay-search-dropdown"></div>
			  <div id="overlay-search-spinner" style="display:none;position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:10;"><div class="spinner"></div></div>
			</div>
			<!-- Query Results section -->
			<div id="query-results" style="margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px;">
				<div id="query-results-header" style="font-weight: bold; margin-bottom: 5px;">Tag Query Results</div>
				<div id="query-results-content">Select a key and value to see results on the map</div>
			</div>
		</div>
	</div>
	<!-- Core Libraries -->
	<script src="src/api/jquery/3.4.1/jquery.min.js"></script>
	<script src="src/api/jquery-ui-1.12.1.custom/jquery-ui.min.js"></script>
	<!-- OpenLayers -->
	<script src="src/api/openlayers/v6.2.2-custom/ol.js"></script>
	<!-- osmtogeojson for data conversion -->
	<script src="https://unpkg.com/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
	<!-- Proj4 for coordinate transformations -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>

	<!-- Vector Tile Style -->
	<script src="src/assets/styles/vector-tile-style.js"></script>
	<!-- ol-mapbox-style for MapTiler styles -->
	<script src="https://unpkg.com/ol-mapbox-style@6.1.3/dist/olms.js"></script>

	<!-- New Taginfo Integration -->
	<script src="src/taginfo_api.js"></script>
	<script src="src/key_searcher.js"></script>
	<script src="src/value_searcher.js"></script>
	<script src="src/tag_query_results.js"></script>

	<!-- Modules -->
	<script type="module" src="src/components/LanguageSelector.js"></script>
	<script type="module" src="src/language_init.js"></script>
	<!-- Overlay modules disabled - replaced by taginfo searchers -->
	<!--<script type="module" src="src/overlays/translated_overlays.js"></script>-->
	<!--<script type="module" src="src/overlays/external/loader.js"></script>-->
	<!--<script type="module" src="src/overlays/index.js"></script>-->
	<!--<script type="module" src="src/overlay_integration.js"></script>-->
	<script type="module" src="src/init.js"></script>

	<!-- Application Logic (old searchers disabled - replaced by taginfo searchers) -->
	<!--<script src="src/layer_search.js"></script>-->
	<!--<script src="src/overlay_search.js"></script>-->
	<script src="src/nominatim_search.js"></script>
	<script src="src/panoramax_viewer.js"></script>
	<script src="src/mapillary_viewer.js"></script>
	<script src="src/router.js"></script>
	<script src="src/index_simple.js"></script>
</body>
</html>
